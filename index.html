<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Drop — Single-Unit Inventory</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-2: #20242e;
      --text: #f3f5f8;
      --muted: #9aa2b1;
      --accent: #3b82f6;
      --gold: #f59e0b;
      --ok: #10b981;
      --warn: #f59e0b;
      --sold: #ef4444;
      --border: #2a303d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1120px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .admin-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; }
    .admin-link:hover { color: var(--text); border-color: var(--accent); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
    .filter-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 0.86rem; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .search-input, .sort-select { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; font-size: 0.88rem; }
    .search-input { flex: 1; min-width: 190px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform 0.15s ease, border-color 0.15s ease; }
    .card.featured { border-color: rgba(245, 158, 11, 0.65); box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.25); }
    .card.highlighted { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45); }

    .gallery { display: flex; gap: 6px; overflow-x: auto; padding: 10px; background: var(--card-2); scroll-snap-type: x mandatory; }
    .gallery img { width: 100%; height: 215px; object-fit: cover; border-radius: 10px; flex: 0 0 100%; scroll-snap-align: start; cursor: zoom-in; }
    .no-img { height: 215px; display: flex; align-items: center; justify-content: center; color: var(--muted); background: var(--card-2); font-size: 0.9rem; }

    .body { padding: 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .title { font-size: 1.08rem; font-weight: 700; }
    .price { font-size: 1.15rem; font-weight: 800; color: #60a5fa; white-space: nowrap; }

    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 0.75rem; padding: 4px 9px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border); color: var(--text); }
    .badge-featured { background: rgba(245, 158, 11, 0.16); border-color: rgba(245, 158, 11, 0.5); color: #fbbf24; font-weight: 600; }
    .status-available { border-color: rgba(16,185,129,0.5); color: #34d399; }
    .status-reserved { border-color: rgba(245,158,11,0.5); color: #fbbf24; }
    .status-sold { border-color: rgba(239,68,68,0.5); color: #f87171; }

    .notes { color: var(--muted); font-size: 0.88rem; line-height: 1.45; white-space: pre-line; }
    .actions { margin-top: auto; padding-top: 8px; display: flex; gap: 8px; }
    .wa-btn { flex: 1; display: block; text-align: center; background: #16a34a; color: #fff; text-decoration: none; font-weight: 600; padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; }
    .wa-btn:hover { background: #15803d; }
    .wa-btn.disabled { background: #2a303d; color: var(--muted); pointer-events: none; }
    .share-btn { background: var(--card-2); color: var(--text); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .share-btn:hover { border-color: var(--accent); }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }

    /* Lightbox Modal */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 20px; z-index: 1000; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 78vh; border-radius: 12px; object-fit: contain; }
    .lb-controls { display: flex; gap: 12px; }
    .lb-btn { background: #262c3a; color: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Available Phones</h1>
      <p class="sub">Real photos, honest condition checks, and direct pricing.</p>
    </div>
    <a class="admin-link" href="./admin.html">Admin</a>
  </header>

  <div class="controls">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="New">New</button>
    <button class="filter-btn" data-filter="Clean Used">Clean Used</button>
    <button class="filter-btn" data-filter="Fair Used">Fair Used</button>
    <button class="filter-btn" data-filter="Needs Work">Needs Work</button>
    <input id="searchInput" class="search-input" type="text" placeholder="Search model, storage, battery..." />
    <select id="sortSelect" class="sort-select" aria-label="Sort phones">
      <option value="featured">Featured & Newest</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
    </select>
  </div>

  <div id="grid" class="grid">
    <p class="empty">Loading devices...</p>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <img id="lbImg" src="" alt="Full view" />
    <div class="lb-controls">
      <button id="lbPrev" class="lb-btn">← Prev</button>
      <button id="lbClose" class="lb-btn">Close</button>
      <button id="lbNext" class="lb-btn">Next →</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
    import { firebaseConfig, WHATSAPP_NUMBER } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const filterBtns = document.querySelectorAll(".filter-btn");

    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");
    const lbClose = document.getElementById("lbClose");

    const focusId = new URLSearchParams(window.location.search).get("id");

    let allPhones = [];
    let activeCondition = "all";
    let lbPhotos = [];
    let lbIndex = 0;

    function statusClass(status) {
      if (status === "Sold") return "status-sold";
      if (status === "Reserved") return "status-reserved";
      return "status-available";
    }

    function escapeHtml(str = "") {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function openLightbox(photos, index) {
      if (!photos.length) return;
      lbPhotos = photos;
      lbIndex = index;
      lbImg.src = lbPhotos[lbIndex];
      lightbox.classList.add("open");
    }

    lbPrev.addEventListener("click", () => {
      if (!lbPhotos.length) return;
      lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
      lbImg.src = lbPhotos[lbIndex];
    });

    lbNext.addEventListener("click", () => {
      if (!lbPhotos.length) return;
      lbIndex = (lbIndex + 1) % lbPhotos.length;
      lbImg.src = lbPhotos[lbIndex];
    });

    lbClose.addEventListener("click", () => lightbox.classList.remove("open"));
    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) lightbox.classList.remove("open");
    });

    function render() {
      const term = searchInput.value.trim().toLowerCase();
      const sortMode = sortSelect.value;

      let filtered = allPhones.filter(p => {
        const matchCond = activeCondition === "all" || p.condition === activeCondition;
        const text = `${p.model} ${p.specs || ""} ${p.notes || ""} ${p.condition || ""}`.toLowerCase();
        const matchSearch = !term || text.includes(term);
        return matchCond && matchSearch;
      });

      filtered.sort((a, b) => {
        if (focusId) {
          if (a.id === focusId && b.id !== focusId) return -1;
          if (b.id === focusId && a.id !== focusId) return 1;
        }
        if (sortMode === "price-asc") return Number(a.price || 0) - Number(b.price || 0);
        if (sortMode === "price-desc") return Number(b.price || 0) - Number(a.price || 0);
        const featDiff = (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
        if (featDiff !== 0) return featDiff;
        return 0;
      });

      if (!filtered.length) {
        grid.innerHTML = `<p class="empty">No matching phones right now.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const imgs = Array.isArray(p.photos) ? p.photos : [];
        const galleryHtml = imgs.length
          ? `<div class="gallery">${imgs.map((src, idx) => `<img src="${src}" data-phone-id="${p.id}" data-img-idx="${idx}" alt="${escapeHtml(p.model)}" loading="lazy" />`).join("")}</div>`
          : `<div class="no-img">No photos attached</div>`;

        const isSold = p.status === "Sold";
        const targetWa = (p.ownerWhatsapp && String(p.ownerWhatsapp).trim()) || WHATSAPP_NUMBER;
        const shareUrl = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(p.id)}`;
        const msg = encodeURIComponent(
          `Hi, I'm interested in: ${p.model} ($${p.price}) — Condition: ${p.condition || "N/A"}\n${shareUrl}`
        );
        const waUrl = `https://wa.me/${targetWa}?text=${msg}`;

        return `
          <article class="card ${p.featured ? "featured" : ""} ${focusId === p.id ? "highlighted" : ""}">
            ${galleryHtml}
            <div class="body">
              <div class="top-row">
                <div class="title">${escapeHtml(p.model)}</div>
                <div class="price">$${escapeHtml(p.price)}</div>
              </div>
              <div class="badges">
                ${p.featured ? `<span class="badge badge-featured">★ Featured</span>` : ""}
                <span class="badge ${statusClass(p.status)}">${escapeHtml(p.status || "Available")}</span>
                ${p.condition ? `<span class="badge">${escapeHtml(p.condition)}</span>` : ""}
                ${p.specs ? `<span class="badge">${escapeHtml(p.specs)}</span>` : ""}
              </div>
              ${p.notes ? `<p class="notes">${escapeHtml(p.notes)}</p>` : ""}
              <div class="actions">
                <a class="wa-btn ${isSold ? "disabled" : ""}" href="${isSold ? "#" : waUrl}" target="_blank" rel="noopener">
                  ${isSold ? "Sold" : "WhatsApp"}
                </a>
                <button class="share-btn" type="button" data-share-id="${p.id}" data-share-title="${escapeHtml(p.model)}">Share</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    grid.addEventListener("click", async e => {
      const img = e.target.closest(".gallery img");
      if (img) {
        const phone = allPhones.find(x => x.id === img.dataset.phoneId);
        if (phone && Array.isArray(phone.photos)) {
          openLightbox(phone.photos, Number(img.dataset.imgIdx || 0));
        }
        return;
      }

      const shareBtn = e.target.closest(".share-btn");
      if (shareBtn) {
        const id = shareBtn.dataset.shareId;
        const title = shareBtn.dataset.shareTitle;
        const url = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(id)}`;
        if (navigator.share) {
          try {
            await navigator.share({ title, url });
            return;
          } catch (_) {}
        }
        await navigator.clipboard.writeText(url);
        const orig = shareBtn.textContent;
        shareBtn.textContent = "Copied!";
        setTimeout(() => { shareBtn.textContent = orig; }, 1500);
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCondition = btn.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);

    const q = query(collection(db, "phones"), orderBy("createdAt", "desc"));
    onSnapshot(q, snap => {
      allPhones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => {
      grid.innerHTML = `<p class="empty">Error loading inventory: ${escapeHtml(err.message)}</p>`;
    });
  </script>
</body>
</html>
